name: Build and release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/WheelMix/WheelMix.csproj
          $version = $project.Project.PropertyGroup.Version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match project version $version." }
      - name: Build, test and package
        shell: pwsh
        run: ./build.ps1
      - name: Upload portable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: WheelMix-win-x64
          path: |
            release/WheelMix-win-x64/WheelMix.exe
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

  # Publishes the tested package from the job above; only tags get write access.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: WheelMix-win-x64
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          {
            echo "## Download"
            echo
            echo "**[⬇ WheelMix.exe]($base/WheelMix.exe)**: download and run. Portable, nothing to install, .NET included."
            echo
            echo "Prefer a folder with the quick start guide and licenses? Get [WheelMix-$GITHUB_REF_NAME-win-x64.zip]($base/WheelMix-$GITHUB_REF_NAME-win-x64.zip)."
            echo "*Source code* archives below are for developers and do not contain the app."
            echo
            echo "Windows 10/11 x64 · Logitech PRO X 2 LIGHTSPEED with its USB receiver. Unsigned: if SmartScreen warns, choose **More info › Run anyway**. Checksums: \`SHA256SUMS.txt\`."
            echo
            echo "## What's new"
            echo
            # The matching CHANGELOG section.
            awk -v heading="## $version" '$0==heading{found=1;next} /^## /{if(found)exit} found' CHANGELOG.md
          } > notes.md
          grep -q '^- ' notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/WheelMix-win-x64/WheelMix.exe dist/*.zip dist/SHA256SUMS.txt --title "WheelMix $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
