name: Suggest an idea
description: A feature, a headset to support or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like WheelMix to do?
      description: Describe the problem it solves for you.
    validations:
      required: true
  - type: input
    id: headset
    attributes:
      label: Headset and connection (if relevant)
      placeholder: PRO X 2 LIGHTSPEED, USB receiver
